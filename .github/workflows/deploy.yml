name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 77.42.43.113
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/content-creation-helper
            git pull --ff-only
            npm install --omit=dev
            systemctl restart content-helper-bot.service
            systemctl status content-helper-bot.service --no-pager
